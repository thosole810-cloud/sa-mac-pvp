<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Sa Mạc Sinh Tử - Battle Royale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: radial-gradient(circle at center, #2a1a0a 0%, #05050a 100%);
    overflow: hidden; font-family: 'Segoe UI', sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; height: 100dvh; touch-action: none; user-select: none;
  }
  #gameWrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; border: 2px solid #4a3a1a; box-shadow: 0 0 60px rgba(255,180,80,0.5); background: #2a1a0a; width: 100%; height: 100%; cursor: crosshair; }
  #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 14px; text-shadow: 0 0 6px #000; pointer-events: none; z-index: 3; }
  
  /* MENU UI */
  #menu { position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(40,20,10,0.97), rgba(5,5,15,0.99)); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 10; padding: 20px; overflow-y: auto; }
  h1 { font-size: 42px; margin-bottom: 6px; background: linear-gradient(90deg,#ffb347,#ffd166,#ff4d6d,#c77dff,#4cc9f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; filter: drop-shadow(0 0 20px rgba(255,180,80,0.6)); }
  .subtitle { color: #d4a574; margin-bottom: 20px; letter-spacing: 3px; font-size: 13px; }
  .stage { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
  .stage.active { display: flex; }
  
  /* BUTTONS */
  .mode-select { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
  .mode-btn { width: 220px; padding: 18px 20px; background: linear-gradient(160deg, #3a2010, #1a0a05); border: 2px solid #6a4a2a; border-radius: 12px; cursor: pointer; transition: all .3s; text-align: center; color: #fff; font-family: inherit; }
  .mode-btn:hover { transform: translateY(-6px) scale(1.04); border-color: #ffb347; box-shadow: 0 12px 35px rgba(255,180,80,0.5); }
  .mode-btn .mode-icon { font-size: 36px; display: block; margin-bottom: 8px; }
  .mode-btn .mode-name { font-size: 17px; font-weight: bold; letter-spacing: 1px; }
  .mode-btn .mode-desc { font-size: 11px; color: #b8a088; margin-top: 4px; }
  
  /* CHARS */
  .chars { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
  .card { width: 130px; padding: 10px 8px; background: linear-gradient(160deg, #2a1a0e, #0f0a05); border: 2px solid #3a2a1a; border-radius: 12px; cursor: pointer; transition: all .3s; text-align: center; }
  .card:hover { transform: translateY(-6px) scale(1.04); border-color: #ffb347; box-shadow: 0 12px 35px rgba(255,180,80,0.5); }
  .card.selected { border-color: #ffb347; box-shadow: 0 0 20px rgba(255,180,80,0.6); }
  .card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); border-color: #444; }
  .card.locked:hover { transform: none; box-shadow: none; border-color: #444; }
  .card .icon { font-size: 28px; margin-bottom: 4px; display: block; }
  .card .name { font-size: 12px; font-weight: bold; margin-bottom: 3px; letter-spacing: 1px; }
  .card .desc { font-size: 9px; color: #b8a088; line-height: 1.4; }
  
  /* LOBBY */
  .room-info { background: linear-gradient(160deg, #3a2010, #1a0a05); border: 2px solid #6a4a2a; border-radius: 12px; padding: 20px 30px; margin-bottom: 20px; text-align: center; min-width: 320px; width: 100%; }
  .room-id-display { font-size: 36px; font-weight: bold; letter-spacing: 6px; color: #ffd166; text-shadow: 0 0 20px rgba(255,209,102,0.8); margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 8px; cursor: pointer; user-select: all; }
  .room-id-display:hover { background: rgba(255,180,80,0.2); }
  .room-players { color: #fff; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
  .room-players .count { color: #06d6a0; font-size: 24px; }
  .player-list { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; margin: 12px 0; }
  .player-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(255,180,80,0.1); border: 1px solid #6a4a2a; border-radius: 6px; font-size: 13px; }
  .player-item .host-badge { background: #ffd166; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  
  /* INPUTS & BTNS */
  .room-select { display: flex; flex-direction: column; gap: 12px; align-items: center; margin-bottom: 20px; width: 100%; }
  .room-btn { width: 100%; padding: 14px 20px; background: linear-gradient(160deg, #3a2010, #1a0a05); border: 2px solid #6a4a2a; border-radius: 10px; cursor: pointer; color: #fff; font-family: inherit; font-size: 15px; transition: all .3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .room-btn:hover { transform: translateY(-3px); border-color: #ffb347; box-shadow: 0 8px 25px rgba(255,180,80,0.4); }
  .btn-green { background: linear-gradient(160deg, #06d6a0, #059669); border-color: #06d6a0; color: #000; font-weight: bold; }
  .btn-green:hover { box-shadow: 0 8px 25px rgba(6,214,160,0.5); }
  .room-input { width: 100%; padding: 12px 15px; background: #1a0f05; border: 2px solid #6a4a2a; border-radius: 10px; color: #fff; font-family: inherit; font-size: 16px; text-align: center; letter-spacing: 2px; outline: none; }
  .room-input:focus { border-color: #ffb347; box-shadow: 0 0 20px rgba(255,180,80,0.4); }
  .back-btn { margin-top: 15px; padding: 8px 20px; background: transparent; border: 2px solid #6a4a2a; color: #b8a088; font-family: inherit; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all .2s; }
  .back-btn:hover { border-color: #ffb347; color: #ffd166; }
  .start-match-btn { padding: 14px 40px; background: linear-gradient(160deg, #06d6a0, #059669); border: 2px solid #06d6a0; color: #fff; font-family: inherit; font-size: 17px; font-weight: bold; border-radius: 12px; cursor: pointer; letter-spacing: 2px; transition: all .3s; box-shadow: 0 0 30px rgba(6,214,160,0.4); width: 100%; margin-top: 10px; }
  .start-match-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 40px rgba(6,214,160,0.7); }
  .status-text { color: #ffd166; font-size: 13px; margin-top: 10px; min-height: 20px; }
  .status-text.error { color: #ff4d6d; }
  .status-text.success { color: #06d6a0; }
  
  /* SHOP & TOUCH */
  #shopBtn { position: absolute; top: 10px; right: 240px; width: 60px; height: 60px; background: linear-gradient(160deg, #ffd166, #a06b1a); border: 3px solid #ffb347; border-radius: 50%; cursor: pointer; color: #000; font-size: 24px; font-weight: bold; box-shadow: 0 0 25px rgba(255,180,80,0.7); z-index: 5; display: none; align-items: center; justify-content: center; flex-direction: column; }
  #shopBtn .label { font-size: 9px; font-weight: bold; }
  #shopPanel { position: absolute; inset: 0; background: rgba(5,5,15,0.92); display: none; justify-content: center; align-items: center; z-index: 20; padding: 20px; }
  #shopPanel.show { display: flex; }
  .shop-wrap { background: linear-gradient(160deg, #2a1a0e, #0f0a05); border: 3px solid #ffb347; border-radius: 16px; padding: 20px 25px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .shop-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6a4a2a; padding-bottom: 12px; margin-bottom: 15px; }
  .shop-title { color: #ffd166; font-size: 24px; font-weight: bold; letter-spacing: 3px; }
  .shop-gold { color: #ffd166; font-size: 20px; font-weight: bold; }
  .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .shop-item { background: linear-gradient(160deg, #3a2010, #1a0a05); border: 2px solid #6a4a2a; border-radius: 10px; padding: 12px; cursor: pointer; transition: all .2s; text-align: center; }
  .shop-item:hover { border-color: #ffd166; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,180,80,0.4); }
  .shop-item.owned { border-color: #06d6a0; opacity: 0.6; cursor: default; }
  .shop-item.owned:hover { transform: none; box-shadow: none; }
  .shop-item .icon { font-size: 30px; display: block; margin-bottom: 5px; }
  .shop-item .name { color: #fff; font-size: 13px; font-weight: bold; margin-bottom: 3px; }
  .shop-item .desc { color: #b8a088; font-size: 10px; margin-bottom: 6px; min-height: 26px; }
  .shop-item .price { color: #ffd166; font-size: 14px; font-weight: bold; }
  .shop-item.owned .price { color: #06d6a0; }
  .close-btn { background: transparent; border: 2px solid #6a4a2a; color: #b8a088; font-family: inherit; font-size: 13px; padding: 8px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: all .2s; }
  .close-btn:hover { border-color: #ffb347; color: #ffd166; }
  
  #touchControls { position: absolute; inset: 0; pointer-events: none; z-index: 15; display: none; }
  #touchControls.show { display: block; }
  #joyBase { position: absolute; left: 30px; bottom: 30px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(255,180,80,0.15), rgba(255,180,80,0.05)); border: 3px solid rgba(255,180,80,0.5); pointer-events: auto; touch-action: none; }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: radial-gradient(circle, #ffd166, #a06b1a); border: 3px solid #ffb347; pointer-events: none; }
  .touch-btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, rgba(255,180,80,0.25), rgba(255,180,80,0.08)); border: 3px solid rgba(255,180,80,0.6); color: #ffd166; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-direction: column; pointer-events: auto; touch-action: none; user-select: none; }
  .touch-btn:active, .touch-btn.pressed { background: radial-gradient(circle, rgba(255,215,0,0.5), rgba(255,180,80,0.2)); transform: scale(0.92); }
  .touch-btn .lbl { font-size: 9px; color: #fff; margin-top: 2px; }
  .touch-btn .cd-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); border-radius: 50%; display: none; align-items: center; justify-content: center; color: #fff; font-size: 16px; font-weight: bold; }
  .touch-btn.cooling .cd-overlay { display: flex; }
  #btnAttack { right: 30px; bottom: 100px; width: 90px; height: 90px; font-size: 32px; border-color: rgba(255,77,109,0.8); background: radial-gradient(circle, rgba(255,77,109,0.35), rgba(255,77,109,0.1)); color: #ff4d6d; }
  #btnAttack:active { background: radial-gradient(circle, rgba(255,77,109,0.7), rgba(255,77,109,0.3)); }
  #btnSkillQ { right: 130px; bottom: 200px; }
  #btnSkillE { right: 30px; bottom: 210px; }
  #btnSkillR { right: 30px; bottom: 300px; border-color: rgba(199,125,255,0.7); background: radial-gradient(circle, rgba(199,125,255,0.3), rgba(199,125,255,0.08)); color: #c77dff; }
  #mobileShopBtn { position: absolute; top: 10px; right: 10px; width: 55px; height: 55px; background: linear-gradient(160deg, #ffd166, #a06b1a); border: 3px solid #ffb347; border-radius: 50%; color: #000; font-size: 22px; font-weight: bold; pointer-events: auto; display: flex; align-items: center; justify-content: center; }

  @media (max-width: 900px) {
    #menu h1 { font-size: 32px; }
    .mode-btn { width: 160px; padding: 14px; }
    .card { width: 100px; }
    #shopBtn { display: none !important; }
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="ui"></div>
  
  <div id="touchControls">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div class="touch-btn" id="btnAttack">⚔<span class="lbl">ĐÁNH</span><div class="cd-overlay">0</div></div>
    <div class="touch-btn" id="btnSkillQ">Q<span class="lbl">CHIÊU</span><div class="cd-overlay">0</div></div>
    <div class="touch-btn" id="btnSkillE">E<span class="lbl">CHIÊU</span><div class="cd-overlay">0</div></div>
    <div class="touch-btn" id="btnSkillR">R<span class="lbl">ULT</span><div class="cd-overlay">0</div></div>
    <div id="mobileShopBtn" onclick="toggleShop()">🛒</div>
  </div>
  
  <button id="shopBtn" onclick="toggleShop()">
    <span>🛒</span><span class="label">SHOP</span>
  </button>
  
  <div id="shopPanel">
    <div class="shop-wrap">
      <div class="shop-header">
        <div class="shop-title">🛒 CỬA HÀNG</div>
        <div class="shop-gold">💰 Vàng: <span id="shopGold">0</span></div>
      </div>
      <div class="shop-items" id="shopItems"></div>
      <button class="close-btn" onclick="toggleShop()">Đóng (ESC)</button>
    </div>
  </div>

  <div id="menu">
    <h1>SA MẠC SINH TỬ</h1>
    <p class="subtitle">B A T T L E &nbsp; R O Y A L E</p>
    
    <!-- STAGE 1: CHỌN CHẾ ĐỘ -->
    <div id="stage1" class="stage active">
      <button class="mode-btn" id="btnPvPBot"><span class="mode-icon">🤖</span><div class="mode-name">PVP WITH BOT</div><div class="mode-desc">6 chiến binh - Sống cuối cùng thắng</div></button>
      <button class="mode-btn" id="btnPvPFriend"><span class="mode-icon">👥</span><div class="mode-name">PVP WITH FRIENDS</div><div class="mode-desc">Kết bạn & Sảnh chờ</div></button>
      <button class="mode-btn" id="btnTraining"><span class="mode-icon">🥋</span><div class="mode-name">TRAINING MODE</div><div class="mode-desc">Test skill - Luyện combo</div></button>
    </div>

    <!-- STAGE 2: CHỌN NHÂN VẬT BOT -->
    <div id="stageBot" class="stage">
      <div class="stage-label">CHỌN CHIẾN BINH</div>
      <div class="chars" id="charListBot"></div>
      <button class="back-btn" onclick="openStage('stage1')">← Quay lại</button>
    </div>

    <!-- STAGE 3: PVP FRIEND (KẾT BẠN) -->
    <div id="stageFriend" class="stage">
      <div id="friendSetup">
        <div class="stage-label">KẾT BẠN & VÀO PHÒNG</div>
        <div id="charListFriend" class="chars"></div>
        
        <input type="text" class="room-input" id="playerNameInput" placeholder="TÊN CỦA BẠN" maxlength="15" style="margin-bottom:10px;">
        <input type="text" class="room-input" id="roomIdInput" placeholder="NHẬP MÃ PHÒNG" maxlength="6" style="margin-bottom:15px;">
        
        <div style="display:flex; gap:10px; width:100%;">
          <button class="room-btn btn-green" id="btnCreateRoom">TẠO PHÒNG</button>
          <button class="room-btn" id="btnJoinRoom">VÀO PHÒNG</button>
        </div>
        <div class="status-text" id="friendStatus" style="margin-top:15px;"></div>
      </div>

      <div id="friendLobby" style="display:none; width:100%;">
        <div class="room-info">
          <div style="color:#b8a088;font-size:12px;letter-spacing:2px;">MÃ PHÒNG (BẤM ĐỂ COPY)</div>
          <div class="room-id-display" id="lobbyRoomId" onclick="copyRoomId()">------</div>
          <div class="room-players">👥 Người chơi: <span class="count" id="lobbyCount">1</span>/5</div>
          <div class="player-list" id="lobbyPlayers"></div>
          <div class="status-text" id="lobbyStatus" style="color:#ffd166;">Đang chờ bạn bè...</div>
          <button class="start-match-btn" id="btnStartMatch" style="display:none;">BẮT ĐẦU TRẬN ĐẤU</button>
        </div>
      </div>
      <button class="back-btn" onclick="leaveRoom()">← Quay lại</button>
    </div>

    <!-- STAGE 4: TRAINING -->
    <div id="stageTrain" class="stage">
      <div class="stage-label">LUYỆN TẬP - CHỌN TƯỚNG</div>
      <div class="chars" id="charListTrain"></div>
      <button class="back-btn" onclick="openStage('stage1')">← Quay lại</button>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = cv.width, H = cv.height;
const menu = document.getElementById('menu');
const uiEl = document.getElementById('ui');

function resizeCanvas() {
  const rect = document.getElementById('gameWrap').getBoundingClientRect();
  cv.width = rect.width; cv.height = rect.height;
  W = cv.width; H = cv.height;
}
resizeCanvas();
addEventListener('resize', () => { resizeCanvas(); });

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const touchState = { joyActive: false, joyId: null, moveX: 0, moveY: 0, attackHeld: false };
const keys = {};
const mouse = { x: W/2, y: H/2, down: false };

// ===== DATA =====
const CHAR_DATA = [
  { name: 'BÌNH AN', color: '#4cc9f0', icon: '🧙', hp: 70, speed: 1.65, radius: 16, atkDmg: 4, atkRange: 240, atkCd: 28, melee: false, maxHp: 180, maxAtkDmg: 14, maxSpeed: 2.4, skills: ['Dịch Chuyển', 'Cầu Lửa', 'Liên Hoàn Đạn'], skillCd: [380, 340, 720], desc: 'Xạ thủ' },
  { name: 'BÌNH MINH', color: '#ffd166', icon: '🛡️', hp: 130, speed: 1.2, radius: 22, atkDmg: 10, atkRange: 55, atkCd: 38, melee: true, maxHp: 300, maxAtkDmg: 32, maxSpeed: 1.9, skills: ['Địa Chấn', 'Húc', 'Cuồng Nộ'], skillCd: [320, 240, 500], desc: 'Đấu sĩ' },
  { name: 'KHẢI KIỆT', color: '#ff4d6d', icon: '⚔️', hp: 85, speed: 2.0, radius: 16, atkDmg: 6, atkRange: 60, atkCd: 20, melee: true, maxHp: 200, maxAtkDmg: 22, maxSpeed: 3.0, skills: ['Chém Xoáy', 'Lướt Kiếm', 'Bão Kiếm'], skillCd: [220, 180, 480], desc: 'Sát thủ' },
  { name: 'KHÔI NGUYÊN', color: '#ffd700', icon: '🌟', hp: 100, speed: 1.45, radius: 18, atkDmg: 7, atkRange: 70, atkCd: 28, melee: true, maxHp: 240, maxAtkDmg: 26, maxSpeed: 2.3, skills: ['Thánh Quang Trói', 'Vòng Xích Thần', 'Thiên Đàng Giam'], skillCd: [280, 380, 720], desc: 'Thánh kỵ sĩ' },
  { name: 'ANNIE NÂU', color: '#c77dff', icon: '🔮', hp: 75, speed: 1.6, radius: 16, atkDmg: 5, atkRange: 230, atkCd: 28, melee: false, maxHp: 180, maxAtkDmg: 18, maxSpeed: 2.4, skills: ['Hắc Cầu', 'Trói Hồn', 'Triệu Hồi Nhện'], skillCd: [200, 260, 840], desc: 'Pháp sư', locked: true },
  { name: 'NHẬT HUY', color: '#06d6a0', icon: '🌀', hp: 90, speed: 1.6, radius: 16, atkDmg: 6, atkRange: 70, atkCd: 24, melee: true, maxHp: 200, maxAtkDmg: 22, maxSpeed: 2.6, skills: ['Bóp Méo', 'Xé Không Gian', 'Hố Đen'], skillCd: [240, 300, 720], desc: 'Bóp méo' },
  { name: 'QUÂN HACKER', color: '#00ff88', icon: '💻', hp: 80, speed: 1.7, radius: 16, atkDmg: 5, atkRange: 75, atkCd: 22, melee: true, maxHp: 180, maxAtkDmg: 20, maxSpeed: 2.7, skills: ['Virus', 'Tường Lửa', 'Hack Hệ Thống'], skillCd: [220, 280, 660], desc: 'Hacker' }
];

const SHOP_ITEMS = [
  { id: 'boots', icon: '👢', name: 'Giày Tốc Độ', desc: '+60% tốc chạy', price: 400 },
  { id: 'armor', icon: '🛡️', name: 'Giáp Sắt', desc: '+40 HP tối đa', price: 450 },
  { id: 'sword', icon: '⚔️', name: 'Kiếm Sắc', desc: '+25% sát thương', price: 550 },
  { id: 'ring', icon: '💍', name: 'Nhẫn Ma Thuật', desc: '-20% hồi chiêu', price: 650 },
  { id: 'potion', icon: '🧪', name: 'Bình Máu', desc: 'Hồi 60 HP', price: 200, consumable: true },
  { id: 'gem', icon: '💎', name: 'Ngọc Sức Mạnh', desc: '+15 dmg', price: 850 }
];

// ===== STATE =====
let obstacles = [], monsters = [], projectiles = [], particles = [], effects = [], damageTexts = [];
let player = null, bots = [], allFighters = [];
let gameTime = 0, matchState = 'menu', matchOver = false, selectedChar = 0;
let screenShake = 0, hitStop = 0, screenFlash = 0, slowMotion = 0;
let socket = null, isHost = false, myRoomId = null, myPlayerId = null;
let playerName = '', shopOpen = false;

// ===== SETUP =====
function openStage(id) {
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function buildCharLists() {
  const html = CHAR_DATA.map((c, i) => `
    <div class="card ${c.locked ? 'locked' : ''}" data-char="${i}">
      <span class="icon">${c.locked ? '🔒' : c.icon}</span>
      <div class="name">${c.name}</div>
      <div class="desc">${c.locked ? 'ĐÃ KHÓA' : c.desc}</div>
    </div>
  `).join('');
  document.getElementById('charListBot').innerHTML = html;
  document.getElementById('charListFriend').innerHTML = html;
  document.getElementById('charListTrain').innerHTML = html;
}
buildCharLists();

// ===== CLASSES =====
class Player {
  constructor(data, isBot, botIndex, total, isRemote, remoteId) {
    this.data = data; this.isBot = isBot; this.isRemote = isRemote; this.remoteId = remoteId;
    this.x = W/2 + (Math.random()-0.5)*200; this.y = H/2 + (Math.random()-0.5)*200;
    this.hp = data.hp; this.maxHp = data.hp; this.radius = data.radius;
    this.angle = 0; this.atkCd = 0; this.skillCds = [0,0,0];
    this.hitFlash = 0; this.dead = false; this.walkPhase = 0; this.bob = 0;
    this.launching = false; this.launchVelY = 0; this.launchOffsetY = 0;
    this.buffs = { root: 0, slow: 0, shield: 0 };
    this.displayName = '';
    this.level = 1; this.xp = 0; this.xpNeeded = 60; this.gold = 150;
    this.attackAnim = 0; this.castAnim = 0;
  }
  update() {
    if (this.dead || this.isRemote) return;
    if (matchState !== 'fighting') return;
    
    if (this.atkCd > 0) this.atkCd--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.buffs.root > 0) this.buffs.root--;
    
    if (this.launching) {
      this.launchOffsetY += this.launchVelY; this.launchVelY += 1.2;
      if (this.launchOffsetY >= 0) { this.launchOffsetY = 0; this.launching = false; }
    }
    for (let i=0;i<3;i++) if (this.skillCds[i] > 0) this.skillCds[i]--;

    let mx = 0, my = 0;
    if (this.isBot) {
      const targets = allFighters.filter(p => !p.dead && p !== this);
      if (targets.length > 0) {
        const t = targets[0]; this.angle = Math.atan2(t.y - this.y, t.x - this.x);
        if (dist(this, t) > 100) { mx = Math.cos(this.angle); my = Math.sin(this.angle); }
        else if (this.atkCd <= 0) this.attack();
      }
    } else {
      if (touchState.joyActive && Math.hypot(touchState.moveX, touchState.moveY) > 0.3) this.angle = Math.atan2(touchState.moveY, touchState.moveX);
      else this.angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
      
      if (keys['w']) my -= 1; if (keys['s']) my += 1; if (keys['a']) mx -= 1; if (keys['d']) mx += 1;
      if (touchState.joyActive) { mx += touchState.moveX; my += touchState.moveY; }
    }

    if (this.buffs.root > 0) mx = my = 0;
    const len = Math.hypot(mx,my);
    if (len > 0) { this.walkPhase += 0.15; this.bob = Math.sin(gameTime * 0.2) * 1.5; this.x += (mx/len) * this.data.speed; this.y += (my/len) * this.data.speed; }
    this.x = clamp(this.x, this.radius, W - this.radius); this.y = clamp(this.y, this.radius, H - this.radius);

    if (!this.isBot && matchState === 'fighting') {
      if (mouse.down && this.atkCd <= 0) this.attack();
      if (keys['q'] && this.skillCds[0] <= 0) this.useSkill(0);
      if (keys['e'] && this.skillCds[1] <= 0) this.useSkill(1);
      if (keys['r'] && this.skillCds[2] <= 0) this.useSkill(2);
    }
  }
  attack() {
    this.atkCd = this.data.atkCd; this.attackAnim = 10;
    const targets = allFighters.filter(p => !p.dead && p !== this);
    if (!this.data.melee) projectiles.push(new Projectile(this.x, this.y, this.angle, 6, this.data.atkDmg, this));
    else targets.forEach(e => { if (dist(this, e) < 80 && Math.abs(Math.atan2(e.y-this.y, e.x-this.x) - this.angle) < 1) e.takeDamage(this.data.atkDmg, this.angle, this); });
  }
  useSkill(idx) {
    this.skillCds[idx] = this.data.skillCd[idx];
    const targets = allFighters.filter(p => !p.dead && p !== this);
    if (idx === 0) {
      targets.forEach(e => { if (dist(this, e) < 200) e.takeDamage(20, this.angle, this); });
      effects.push(new ShockwaveEffect(this.x, this.y, 200, this.data.color, 40));
    } else if (idx === 1) {
      this.buffs.shield = 180;
    } else {
      targets.forEach(e => { e.takeDamage(40, this.angle, this); triggerLaunch(e, 15); });
      effects.push(new ShockwaveEffect(this.x, this.y, 300, this.data.color, 60));
      screenFlash = 0.5; slowMotion = 10;
    }
  }
  takeDamage(dmg, angle, attacker) {
    if (this.dead) return;
    this.hp -= dmg; this.hitFlash = 10; screenShake = 10;
    addDamageText(this.x, this.y, Math.round(dmg), '#ff4d6d');
    if (dmg >= 20) triggerLaunch(this, 10);
    if (this.hp <= 0) { this.dead = true; spawnParticles(this.x, this.y, this.data.color, 30, 5); }
  }
  draw() {
    if (this.dead) return;
    ctx.save(); ctx.translate(this.x, this.y + this.launchOffsetY);
    ctx.fillStyle = this.data.color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill();
    if (this.hitFlash > 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center'; ctx.fillText(this.displayName || this.data.name, 0, -this.radius - 15);
    ctx.fillStyle = 'red'; ctx.fillRect(-25, -this.radius - 10, 50 * (this.hp/this.maxHp), 5);
    ctx.restore();
  }
}

class Projectile {
  constructor(x,y,a,r,d,src){ this.x=x;this.y=y;this.angle=a;this.radius=r;this.dmg=d;this.source=src;this.speed=8;this.life=100; }
  update(){ this.x+=Math.cos(this.angle)*this.speed; this.y+=Math.sin(this.angle)*this.speed; this.life--; }
  draw(){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.x,this.y,this.radius,0,Math.PI*2); ctx.fill(); }
  get dead(){ return this.life <= 0; }
}

class ShockwaveEffect { constructor(x,y,r,c,l){this.x=x;this.y=y;this.maxR=r;this.color=c;this.life=l;this.maxLife=l;this.r=0;} update(){this.life--;this.r=this.maxR*(1-this.life/this.maxLife);} draw(){ctx.save();ctx.globalAlpha=this.life/this.maxLife;ctx.strokeStyle=this.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();ctx.restore();} get dead(){return this.life<=0;} }

// ===== HELPERS =====
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function triggerLaunch(t, f) { if(t.dead) return; t.launching = true; t.launchVelY = -f; }
function addDamageText(x,y,v,c) { damageTexts.push({x,y,val:v,color:c,life:45}); }
function spawnParticles(x,y,c,n,s) {}
function toggleShop() { if (!player || matchState !== 'fighting') return; shopOpen = !shopOpen; document.getElementById('shopPanel').classList.toggle('show', shopOpen); }
function copyRoomId() { const id = document.getElementById('lobbyRoomId').textContent; if (id !== '------') { navigator.clipboard.writeText(id); alert('Đã copy mã phòng!'); } }

// ===== MENU LOGIC =====
document.getElementById('btnPvPBot').addEventListener('click', () => openStage('stageBot'));
document.getElementById('btnTraining').addEventListener('click', () => openStage('stageTrain'));
document.getElementById('btnPvPFriend').addEventListener('click', () => { openStage('stageFriend'); document.getElementById('friendSetup').style.display = 'block'; document.getElementById('friendLobby').style.display = 'none'; });

document.querySelectorAll('#charListBot .card').forEach(c => c.addEventListener('click', () => { const i = parseInt(c.dataset.char); if (!CHAR_DATA[i].locked) startGame('bot', i); }));
document.querySelectorAll('#charListTrain .card').forEach(c => c.addEventListener('click', () => { const i = parseInt(c.dataset.char); if (!CHAR_DATA[i].locked) startGame('training', i); }));
document.querySelectorAll('#charListFriend .card').forEach(c => c.addEventListener('click', () => {
  const i = parseInt(c.dataset.char); if (CHAR_DATA[i].locked) return;
  selectedChar = i; document.querySelectorAll('#charListFriend .card').forEach(el => el.classList.remove('selected')); c.classList.add('selected');
}));

function backToMenu() {
  if (socket) { socket.disconnect(); socket = null; }
  isHost = false; myRoomId = null; matchState = 'menu'; menu.style.display = 'flex'; openStage('stage1');
}

function startGame(mode, charIdx) {
  menu.style.display = 'none'; matchState = 'fighting'; matchOver = false;
  allFighters = []; player = null;
  if (mode === 'bot') {
    for (let i=0; i<5; i++) allFighters.push(new Player(CHAR_DATA[(charIdx+1+i)%7], true, i, 6));
    player = new Player(CHAR_DATA[charIdx], false, 0, 6);
  } else {
    player = new Player(CHAR_DATA[charIdx], false, 0, 1);
  }
  player.displayName = mode === 'friend' ? playerName : 'BẠN';
  allFighters.push(player);
  gameTime = 0; requestAnimationFrame(loop);
}

// ===== NETWORK =====
function connectServer(cb) {
  if (socket && socket.connected) { cb(); return; }
  socket = io();
  socket.on('connect', () => { myPlayerId = socket.id; cb(); });
  socket.on('room_created', (d) => {
    myRoomId = d.roomId; isHost = true; document.getElementById('lobbyRoomId').textContent = d.roomId;
    document.getElementById('friendSetup').style.display = 'none'; document.getElementById('friendLobby').style.display = 'block';
    updateLobby(d.players);
  });
  socket.on('lobby_update', (d) => updateLobby(d.players));
  socket.on('join_error', (d) => document.getElementById('friendStatus').textContent = '❌ ' + d.message);
  socket.on('match_start', (d) => {
    menu.style.display = 'none'; matchState = 'fighting'; matchOver = false; allFighters = [];
    d.players.forEach((pd, i) => { const p = new Player(CHAR_DATA[pd.charIndex], false, i, d.players.length, pd.id !== myPlayerId, pd.id); p.displayName = pd.name; if (pd.id === myPlayerId) player = p; allFighters.push(p); });
    requestAnimationFrame(loop);
  });
  socket.on('state_sync', (s) => { if (!isHost) s.players.forEach(ps => { const f = allFighters.find(x => x.remoteId === ps.id); if (f && f !== player) { f.x = ps.x; f.y = ps.y; f.hp = ps.hp; f.dead = ps.dead; } }); });
  socket.on('remote_skill', (d) => { if (isHost) { const p = allFighters.find(x => x.remoteId === d.playerId); if (p && !p.dead) { p.x = d.x; p.y = d.y; p.angle = d.angle; d.type === 'attack' ? p.attack() : p.useSkill(d.skill); } } });
}

function updateLobby(players) {
  document.getElementById('lobbyCount').textContent = players.length;
  document.getElementById('lobbyPlayers').innerHTML = players.map(p => `<div class="player-item"><span>${p.name}</span>${p.isHost?'<span class="host-badge">HOST</span>':''}</div>`).join('');
  if (isHost) document.getElementById('btnStartMatch').style.display = players.length >= 2 ? 'block' : 'none';
}

document.getElementById('btnCreateRoom').addEventListener('click', () => {
  playerName = document.getElementById('playerNameInput').value.trim() || 'HOST';
  connectServer(() => socket.emit('create_room', { name: playerName, charIndex: selectedChar }));
});
document.getElementById('btnJoinRoom').addEventListener('click', () => {
  const id = document.getElementById('roomIdInput').value.trim().toUpperCase();
  if (id.length !== 6) return alert('Mã phòng phải 6 ký tự!');
  playerName = document.getElementById('playerNameInput').value.trim() || 'PLAYER';
  myRoomId = id;
  connectServer(() => socket.emit('join_room', { roomId: id, name: playerName, charIndex: selectedChar }));
});
document.getElementById('btnStartMatch').addEventListener('click', () => { if (socket && isHost) socket.emit('start_match'); });
document.getElementById('backToMenuBtn')?.addEventListener('click', backToMenu);

// ===== MAIN LOOP =====
function loop() {
  requestAnimationFrame(loop);
  if (matchState !== 'fighting') return;
  if (slowMotion > 0) { slowMotion--; gameTime++; } else { gameTime++; }

  allFighters.forEach(f => f.update());
  projectiles.forEach(p => p.update()); projectiles = projectiles.filter(p => !p.dead);
  effects.forEach(e => e.update()); effects = effects.filter(e => !e.dead);
  damageTexts.forEach(d => { d.y -= 1; d.life--; }); damageTexts = damageTexts.filter(d => d.life > 0);

  if (socket && isHost && gameTime % 2 === 0) {
    socket.emit('state_update', { players: allFighters.map(f => ({ id: f.remoteId||myPlayerId, x: f.x, y: f.y, hp: f.hp, dead: f.dead })) });
  }
  if (socket && !isHost && gameTime % 2 === 0 && player && !player.dead) {
    socket.emit('player_action', { type: 'pos', x: player.x, y: player.y, hp: player.hp });
  }
  render();
}

// ===== RENDER =====
function render() {
  ctx.fillStyle = '#2a1a0a'; ctx.fillRect(0, 0, W, H);
  if (screenShake > 0) { ctx.translate(Math.random()*screenShake, Math.random()*screenShake); screenShake *= 0.9; }
  if (screenFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${screenFlash})`; ctx.fillRect(0,0,W,H); screenFlash *= 0.9; }
  allFighters.forEach(f => f.draw());
  projectiles.forEach(p => p.draw());
  effects.forEach(e => e.draw());
  damageTexts.forEach(d => { ctx.fillStyle = d.color; ctx.font = 'bold 20px Arial'; ctx.fillText(d.val, d.x, d.y); });
}

// Touch & Keyboard
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * (W/r.width); mouse.y = (e.clientY - r.top) * (H/r.height); });
cv.addEventListener('mousedown', () => mouse.down = true);
cv.addEventListener('mouseup', () => mouse.down = false);
</script>
